<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Panel UI Selector</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body {
      background-color: #050b14; color: #e2e8f0; display: flex;
      justify-content: center; align-items: center; min-height: 100vh; padding: 16px;
    }
    .container {
      width: 100%; max-width: 390px; background: #09121e;
      border: 1.5px solid #00ff66; border-radius: 16px; padding: 20px 16px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.15); position: relative;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; border-bottom: 1px solid #16263b; padding-bottom: 12px;
    }
    .top-title { font-size: 13px; font-weight: bold; color: #cbd5e1; }
    .back-btn {
      font-size: 11px; color: #00e5ff; text-decoration: none;
      border: 1px solid #00e5ff; padding: 4px 8px; border-radius: 6px;
    }
    .label {
      font-size: 12px; font-weight: bold; color: #00e5ff;
      letter-spacing: 1px; margin-bottom: 8px; display: block;
    }
    .dropdown-wrapper { position: relative; margin-bottom: 18px; }
    .selected-box {
      display: flex; align-items: center; justify-content: space-between;
      background: #0b1626; border: 2px solid #00ff66; border-radius: 12px;
      padding: 10px 14px; cursor: pointer; box-shadow: 0 0 12px rgba(0, 255, 102, 0.2);
    }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .panel-icon {
      width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid #00e5ff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 12px; color: #fff;
      background: linear-gradient(135deg, #102a43, #1e1b4b);
    }
    .panel-info h4 { font-size: 15px; color: #ffffff; }
    .panel-info span { font-size: 10px; color: #00ff66; font-weight: bold; display: block; margin-top: 3px; }
    .arrow { color: #cbd5e1; font-size: 12px; transition: transform 0.2s; }
    .dropdown-list {
      display: none; position: absolute; top: 72px; left: 0; width: 100%;
      background: #0a1422; border: 1.5px solid #00ff66; border-radius: 12px;
      padding: 8px; z-index: 100; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      max-height: 280px; overflow-y: auto;
    }
    .dropdown-list.open { display: block; }
    .option-item {
      display: flex; align-items: center; gap: 12px; padding: 10px;
      border-radius: 8px; cursor: pointer;
    }
    .option-item:hover { background: rgba(0, 255, 102, 0.12); }
    .option-item .opt-name { font-size: 14px; font-weight: bold; color: #f1f5f9; }
    .execute-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(90deg, #00c853, #00ff66);
      border: none; border-radius: 10px; color: #021208;
      font-size: 15px; font-weight: 900; letter-spacing: 1.5px; cursor: pointer;
    }
    .status-box {
      margin-top: 16px; background: #050a12; border: 1px solid #1e293b;
      border-radius: 8px; padding: 12px; font-size: 12px; color: #00ff66; display: none;
    }
    .credits { text-align: center; margin-top: 18px; font-size: 11px; color: #475569; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="top-title">📱 FF Panel UI Selector</div>
      <a href="index.html" class="back-btn">← STORE</a>
    </div>

    <span class="label">SELECT PANEL UI</span>

    <div class="dropdown-wrapper">
      <div class="selected-box" onclick="toggleDropdown()">
        <div class="item-left">
          <div class="panel-icon" id="selectedIcon">ABCD</div>
          <div class="panel-info">
            <h4 id="selectedName">ABCD PANEL</h4>
            <span>⚡ SELECTED TEMPLATE</span>
          </div>
        </div>
        <div class="arrow" id="arrowIcon">▼</div>
      </div>

      <div class="dropdown-list" id="dropdownList">
        <div class="option-item" onclick="selectPanel('ABCD PANEL', 'ABCD', '#1e1b4b')">
          <div class="panel-icon" style="background:#1e1b4b;">ABCD</div>
          <div class="opt-name">ABCD PANEL</div>
        </div>
        <div class="option-item" onclick="selectPanel('Aincrad Panel', 'AIN', '#0f172a')">
          <div class="panel-icon" style="border-radius:50%; background:#0f172a;">▲</div>
          <div class="opt-name">Aincrad Panel</div>
        </div>
        <div class="option-item" onclick="selectPanel('Bala Mod Pro', 'V', '#ffffff')">
          <div class="panel-icon" style="background:#fff; color:#000; font-size:18px;">V</div>
          <div class="opt-name">Bala Mod Pro</div>
        </div>
        <div class="option-item" onclick="selectPanel('Drip Client', 'DRIP', '#4c1d95')">
          <div class="panel-icon" style="background:#4c1d95;">DRIP</div>
          <div class="opt-name">Drip Client</div>
        </div>
        <div class="option-item" onclick="selectPanel('Angry Mod', 'MOD', '#701a75')">
          <div class="panel-icon" style="border-radius:50%; background:#701a75;">😈</div>
          <div class="opt-name">Angry Mod</div>
        </div>
        <div class="option-item" onclick="selectPanel('X-REG Non Root', 'X-REG', '#172554')">
          <div class="panel-icon" style="background:#172554;">X-REG</div>
          <div class="opt-name">X-REG Non Root</div>
        </div>
      </div>
    </div>

    <button class="execute-btn" onclick="executeBuild()">EXECUTE BUILD</button>
    <div class="status-box" id="statusBox"></div>
    <div class="credits">[ SYSTEM CREDITS // RAFSAN ]</div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
    }

    let currentPanel = "ABCD PANEL";

    function toggleDropdown() {
      const list = document.getElementById('dropdownList');
      const arrow = document.getElementById('arrowIcon');
      list.classList.toggle('open');
      arrow.style.transform = list.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function selectPanel(name, iconText, bgColor) {
      currentPanel = name;
      document.getElementById('selectedName').innerText = name;
      const iconEl = document.getElementById('selectedIcon');
      iconEl.innerText = iconText === 'AIN' ? '▲' : (iconText === 'MOD' ? '😈' : iconText);
      iconEl.style.background = bgColor;
      iconEl.style.color = bgColor === '#ffffff' ? '#000' : '#fff';
      toggleDropdown();
    }

    function executeBuild() {
      const box = document.getElementById('statusBox');
      box.style.display = 'block';
      box.innerHTML = `> Building package for <b>${currentPanel}</b>...`;
      
      setTimeout(() => {
        window.location.href = "install.html?panel=" + encodeURIComponent(currentPanel);
      }, 1200);
    }
  </script>
</body>
        </html>
